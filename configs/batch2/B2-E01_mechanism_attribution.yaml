# B2-E01 - Failure-mechanism attribution by mathematically equivalent reformulation, plus an FP64
# precision control, at matched compute. MECHANISTIC DIAGNOSTIC / BENCHMARK STUDY - not a method claim.
# Pre-registration: docs/hypotheses/B2-E01.md. Approved by the PI on 2026-10-07 (stage 1: seed 1234).
experiment: B2-E01
status: approved
base_frozen: batch1_hard_tanh2      # B1; only train.max_steps (and, for B1_fp64, precision) differ
max_steps: 5000                     # x mini-batch 128 = 640,000 collocation (PDE) points per arm
snapshot_every: 1000                # analysis snapshots (cadence only; not part of any run key)
seeds_stage1: [1234]
seeds_stage2: [1235, 1236]          # NOT approved; recommended in the report if decision-relevant
arms:
  B1:      {kind: baseline, change: "none (frozen B1 at 640k PDE evaluations; reproducibility + compute reference)"}
  B1_fp64: {kind: precision_control, precision: float64, change: "precision float32 -> float64; identical initial weights/draws (FP32 init cast)"}
  mixed:   {kind: arm, change: "formulation strong -> mixed (v = u_xx); 2-output head; highest derivative order 4 -> 2"}
  modal:   {kind: diagnostic, change: "field (x,t)->u  ->  u = A0 phi1(x) q_theta(t), q learned; spatial field removed (DIAGNOSTIC ONLY)"}
primary_metric: persistence_cycles          # frozen Batch-1 definition (physref.persistence)
secondary_metrics: [L2_exact, L2_paper, PDE_residual_rel, IC_error_max, BC_error_max, fit_w, fit_lam, phase_error_exact, amplitude_error_exact, train_seconds, peak_rss_mb]
