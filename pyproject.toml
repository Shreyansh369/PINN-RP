[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-rp"
version = "0.2.0.dev0"
description = "PINN-RP Batch 2: compute-aware physics reference layer research (frozen Batch-1 beampinn + physref)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
